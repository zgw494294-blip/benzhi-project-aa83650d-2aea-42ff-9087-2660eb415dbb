<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhonemeReleaseDesk 音素发布资格工作台</title><link rel="stylesheet" href="/assets/app.css"></head><body>
<header><div><span class="eyebrow">DIALECT CORPUS CONTROL</span><h1>音素发布资格工作台</h1></div><div id="service-state" class="pill">正在连接</div></header><main>
<aside><h2>批次</h2><button id="reload" class="secondary">刷新列表</button><div id="batch-list"></div><form id="create-form"><h3>新建批次</h3><label>批次 ID<input name="id" value="demo-batch" required></label><label>方言点<input name="dialectSite" value="示例方言点" required></label><label>音标体系<input name="phoneticSystem" value="IPA" required></label><label>允许标签（逗号分隔）<input name="labels" value="a,i,k" required></label><label>最短片段毫秒<input name="minimum" type="number" value="100" min="1"></label><button>创建</button></form></aside>
<section class="workspace"><div class="batch-head"><div><span id="batch-state" class="state">未选择</span><h2 id="batch-title">请选择或创建批次</h2></div><div class="version">version <strong id="batch-version">—</strong></div></div><nav id="steps"><button data-panel="scope">1 范围</button><button data-panel="annotation">2 双标</button><button data-panel="check">3 检查</button><button data-panel="review">4 裁定与复核</button><button data-panel="credential">5 凭据</button></nav><div id="notice" aria-live="polite"></div>
<section id="scope" class="panel"><h3>登记与冻结范围</h3><form id="segment-form" class="grid"><label>片段 ID<input name="id" value="seg-1"></label><label>来源编号<input name="sourceRef" value="recording-001"></label><label>起始毫秒<input name="start" type="number" value="0"></label><label>结束毫秒<input name="end" type="number" value="1000"></label><label>说话人<input name="speaker" value="SPK01"></label><label>目标文本<input name="prompt" value="示例文本"></label><button>登记片段</button></form>
<form id="segment-bulk-form"><h4>批量片段预检与原子登记</h4><label>多行片段 JSON<textarea name="segments">[{"id":"seg-2","sourceRef":"recording-001","startMillis":1000,"endMillis":2000,"speakerCode":"SPK01","promptText":"第二条文本"}]</textarea></label><div class="actions"><button name="preflight">预检全部行</button><button name="confirm" type="button" disabled>确认原子登记</button></div></form><div id="segment-preflight"></div><div id="segments"></div><button id="freeze" class="danger">冻结发布范围</button></section>
<section id="annotation" class="panel hidden"><h3>双人独立标注</h3><p>先形成双人任务计划，再由两名标注员独立提交自己的有序音素区间。</p><form id="assign-form" class="grid"><label>片段 ID<input name="segmentId" value="seg-1"></label><label>标注员 A<input name="first" value="ann-a"></label><label>标注员 B<input name="second" value="ann-b"></label><button>分配</button></form>
<form id="assignment-bulk-form"><h4>双标任务批量计划</h4><label>分配计划 JSON<textarea name="plan">[{"segmentId":"seg-1","firstAnnotatorId":"ann-a","secondAnnotatorId":"ann-b"}]</textarea></label><div class="actions"><button name="preview">预览负载与遗漏</button><button name="confirm" type="button" disabled>确认原子分配</button></div></form><div id="assignment-preview"></div><form id="submission-form"><label>片段 ID<input name="segmentId" value="seg-1"></label><label>标注员<input name="annotator" value="ann-a"></label><label>有序区间 JSON<textarea name="intervals">[{"startMillis":0,"endMillis":1000,"label":"a"}]</textarea></label><button>独立提交</button></form><div id="submissions"></div></section>
<section id="check" class="panel hidden"><h3>发布资格检查</h3><button id="run-check">运行确定性检查</button><form id="history-form" class="grid"><label>规则筛选<input name="rule"></label><label>片段筛选<input name="segmentId"></label><button>查询检查历史</button><label>前一次 run ID<input name="before"></label><label>后一次 run ID<input name="after"></label><button name="compare" type="button">对比运行</button></form><div id="check-history"></div><div id="checks"></div></section>
<section id="review" class="panel hidden"><h3>冲突裁定与定向返修</h3><form id="queue-form" class="grid"><label>片段筛选<input name="segmentId"></label><label>候选标签<input name="candidate"></label><button>刷新未决队列</button></form><div id="decision-queue"></div>
<form id="decision-bulk-form"><h4>原子批量裁定</h4><label>裁定结果 JSON<textarea name="decisions">[{"segmentId":"seg-1","intervalKey":"0-1000","resolvedLabel":"a","reason":"结合声学证据确定","adjudicatorId":"judge-1"}]</textarea></label><label>当前裁定员<input name="actor" value="judge-1"></label><button>批量确认</button></form><form id="decision-form" class="grid"><label>片段 ID<input name="segmentId" value="seg-1"></label><label>区间键<input name="intervalKey" value="0-1000"></label><label>最终标签<input name="label" value="a"></label><label>裁定理由<input name="reason" value="结合声学证据确定"></label><label>裁定员<input name="actor" value="judge-1"></label><button>提交裁定</button></form>
<form id="repair-form" class="grid"><label>片段 ID<input name="segmentId" value="seg-1"></label><label>命中规则<input name="rule" value="label-whitelist"></label><label>目标<select name="targetKind"><option value="annotation">标注</option><option value="adjudication">裁定</option></select></label><label>标注员/区间键<input name="target" value="ann-a"></label><label>退回理由<input name="reason" value="请核对目标音素"></label><label>复核员<input name="reviewer" value="reviewer-1"></label><button>定向退回</button></form><form id="repair-query" class="grid"><label>任务状态<input name="status"></label><label>角色<select name="role"><option value="reviewer">复核员</option><option value="annotator">标注员</option><option value="adjudicator">裁定员</option></select></label><label>操作者<input name="actor" value="reviewer-1"></label><button>查询返修任务与差异</button></form><div id="repair-tasks"></div><button id="seal" class="danger">复核通过并封存</button><div id="decisions"></div></section>
<section id="credential" class="panel hidden"><h3>发布凭据明细与分项核验</h3><form id="credential-detail-form" class="grid"><label>凭据 ID<input name="credentialId"></label><label>批次 ID<input name="batchId"></label><label>片段筛选<input name="segmentId"></label><label>页码<input name="page" type="number" min="1" value="1"></label><label>每页<input name="pageSize" type="number" min="1" max="100" value="20"></label><button>检索明细</button><button name="verify" type="button">分项核验</button></form><form id="verify-form"><label>凭据 ID<input name="credentialId"></label><button>按凭据独立核验</button></form><pre id="credential-output">尚未签发凭据</pre></section>
<details><summary>当前批次完整投影</summary><pre id="raw">{}</pre></details></section></main><script src="/assets/app.js" defer></script></body></html>
